<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fdf6e3" />
  <title>호두마루 - Zombie Survival</title>
</head>
<body>
  <main id="app" class="lobby-screen">
    <div class="lobby-center">
      <div class="logo">호두마루</div>
      <div class="logo-sub">ZOMBIE SURVIVAL</div>

      <div class="res-row">
        <div class="rb cb">🪙 <span id="coin-count">0</span></div>
        <div class="rb eb">⚡ <span id="energy-count">0</span></div>
      </div>

      <div class="lobby-grid">
        <button class="lb play" type="button" data-action="play">▶ 플레이</button>

        <div class="pl-level-bar" data-action="level">
          <div class="pl-lv-badge">Lv.<span id="player-level">1</span></div>
          <div class="pl-bar-track">
            <div class="pl-bar-fill" id="exp-fill"></div>
            <div class="pl-bar-txt" id="exp-label">0 / 100</div>
          </div>
          <button class="pl-star-btn" type="button" data-action="star" aria-label="차원의 별">🌠</button>
        </div>

        <button class="lb shop" type="button" data-action="shop">🛒 상점</button>
        <button class="lb skin" type="button" data-action="jobs">⚔️ 직업</button>
        <button class="lb upg" type="button" data-action="upgrades">⬆ 영구업그레이드</button>
        <button class="lb equip" type="button" data-action="equipment">🎒 장비</button>
        <button class="lb locked" type="button" data-action="pets">🔒 ???</button>
        <button class="lb locked" type="button" data-action="relics">🔒 ???</button>
        <button class="lb ach" type="button" data-action="achievements">🏆 업적</button>
        <button class="lb quest" type="button" data-action="quests">📅 퀘스트</button>
      </div>
    </div>

    <aside class="side-tabs right-tabs" aria-label="추가 메뉴">
      <button class="side-tab event-tab" type="button" data-action="events"><span>🎉</span><b>이벤트</b></button>
      <button class="side-tab season-tab" type="button" data-action="season"><span>🌟</span><b>시즌패스</b></button>
      <button class="side-tab enchant-tab" type="button" data-action="enchant"><span>🔮</span><b>인챈트</b></button>
    </aside>
    <aside class="side-tabs left-tabs" aria-label="인벤토리">
      <button class="side-tab inventory-tab" type="button" data-action="inventory"><span>🎒</span><b>인벤토리</b></button>
    </aside>

    <button class="notice-float" type="button" data-action="notice">
      <span class="notice-bell">🔔</span><span>공지사항</span><i>NEW</i>
    </button>

    <div class="daily-box" aria-hidden="true"><span>🎁</span></div>
    <div class="version-label">호두마루 RE:MAKE</div>

    <div class="audio-control">
      <span>🎵 BGM</span>
      <input id="bgm-volume" type="range" min="0" max="1" step="0.05" value="0.18" aria-label="배경음악 음량" />
      <button type="button" data-action="audio">ON/OFF</button>
    </div>
    <button class="corner-button code-button" type="button" data-action="code">🔑 CODE</button>
    <button class="corner-button settings-button" type="button" data-action="settings">⚙️ 설정</button>
    <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
